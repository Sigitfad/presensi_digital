  <style>
    .foto-circle-lg{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #E2E8F0;display:block;margin:0 auto;}
    .foto-ini-lg{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#DBEAFE,#EDE9FE);display:flex;align-items:center;justify-content:center;font-family:var(--font-main);font-size:28px;font-weight:800;color:#2563EB;border:3px solid #E2E8F0;margin:0 auto;}
    .foto-sm-img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #E2E8F0;cursor:pointer;}
    .foto-sm-ini{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#DBEAFE,#EDE9FE);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#2563EB;border:2px solid #E2E8F0;cursor:pointer;flex-shrink:0;}
    .btn-foto-edit{display:block;margin:8px auto 0;background:var(--primary-light);color:var(--primary);border:none;border-radius:8px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;}
    .btn-foto-edit:hover{background:var(--primary);color:white;}
    .btn-grad{width:26px;height:26px;border:none;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;font-size:10px;color:white;}
    .btn-grad:hover{transform:translateY(-1px);}
    .btn-grad.view{background:linear-gradient(135deg,#0EA5E9,#0284C7);}
    .btn-grad.view:hover{box-shadow:0 4px 12px rgba(14,165,233,0.35);}
    .btn-grad.edit{background:linear-gradient(135deg,#F59E0B,#D97706);}
    .btn-grad.edit:hover{box-shadow:0 4px 12px rgba(245,158,11,0.35);}
    .btn-grad.hapus{background:linear-gradient(135deg,#EF4444,#DC2626);}
    .btn-grad.hapus:hover{box-shadow:0 4px 12px rgba(239,68,68,0.35);}
    .btn-batal{background:#1E293B;color:white;border:none;font-weight:600;padding:6px 14px;font-size:12px;border-radius:8px;transition:all 0.2s linear;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
    .btn-batal:hover{background:#334155;transform:translateY(-1px);box-shadow:0 4px 10px rgba(30,41,59,0.3);}
    #modalTambah .form-control-modern,
    #modalEdit .form-control-modern{padding:4px 8px;font-size:11px;}
    #modalTambah .form-label-modern,
    #modalEdit .form-label-modern{font-size:11px;margin-bottom:2px;}

    .card-modern-header{padding:12px 16px;}
    .card-modern-title{font-size:13px;}
    .card-modern .table-modern{font-size:11.5px;}
    .card-modern .btn-primary-custom,
    .card-modern .btn-danger-custom{padding:4px 10px;font-size:11px;}
    .kelas-popup{position:fixed;background:#1E293B;color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;z-index:99999;max-width:180px;width:fit-content;word-break:break-word;box-shadow:0 4px 16px rgba(0,0,0,0.25);animation:kelasFadeIn 0.15s ease;cursor:default;user-select:text;}
.kelas-popup-close{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#EF4444;color:#fff;border:none;font-size:10px;line-height:18px;text-align:center;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;}
@keyframes kelasFadeIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
.swal-kecil{font-size:12px!important;border-radius:12px!important;}.swal-title-kecil{font-size:14px!important;padding:0!important;margin:0 0 4px!important;}.swal-text-kecil{font-size:12px!important;margin:0!important;}.swal-btn-kecil{font-size:11px!important;padding:5px 14px!important;border-radius:8px!important;}.swal-kecil .swal2-confirm,.swal-kecil .swal2-cancel{transition:all 0.2s ease!important;}.swal-kecil .swal2-confirm:hover,.swal-kecil .swal2-cancel:hover{filter:brightness(1.2)!important;transform:translateY(-1px)!important;box-shadow:0 4px 14px rgba(0,0,0,0.25)!important;}
.uid-hidden{display:none!important;}
#toggleEditUidBtn:hover{background:rgba(255,255,255,0.3)!important;transform:translateY(-1px);}


.btn-close-custom{background:#1E293B;color:white;border:none;padding:6px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all 0.25s ease;text-decoration:none;font-family:var(--font-body);}
.btn-close-custom:hover{background:#000;transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,0.3);color:white;}
.btn-close-custom:active{transform:translateY(0);box-shadow:none;}
</style>

<script>
const ROLE_BADGE={
  kepala_sekolah:`<span style="background:#EDE9FE;color:#7C3AED;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700;">Kepala Sekolah</span>`,

};

let tambahUserBlob=null;
let editUserBlob=null, editUserFotoSrc='', editUserId=null;

// Isi dropdown kelas dari database
async function isiKelasOptions(selectId){
  const sel=document.getElementById(selectId);
  sel.innerHTML='<option value="Semua">Semua Kelas</option>';
  try {
    const res=await fetch('/api/kelas');
    const json=await res.json();
    (json.data||[]).forEach(k=>{
      sel.innerHTML+=`<option value="Kelas ${k.nama}">Kelas ${k.nama}</option>`;
    });
  } catch(e){}
}

// Enable/disable kelas berdasarkan role
function toggleKelasSelect(kelasId, roleId){
  const role=document.getElementById(roleId).value;
  const sel =document.getElementById(kelasId);
  const wrap=sel.closest('.col-md-6, .col-12');
  const checkboxId = kelasId === 'u_pengampu' ? 'u_pengampu_checkboxes' : 'eu_pengampu_checkboxes';
  const cbContainer = document.getElementById(checkboxId);
  const bidangId = kelasId === 'u_pengampu' ? 'u_bidang' : 'eu_bidang';
  const bidangSel = document.getElementById(bidangId);
  const bidangWrap = bidangSel ? bidangSel.closest('.col-md-6') : null;

  // Sembunyikan checkboxes dulu
  if(cbContainer) cbContainer.style.display='none';
  sel.style.display='';

  const isTambah = kelasId === 'u_pengampu';
  const roleWrap = document.getElementById(roleId)?.closest('.col-md-6');
  const alamatId = isTambah ? 'u_alamat' : 'eu_alamat';
  const alamatWrap = document.getElementById(alamatId)?.closest('.col-md-6, .col-12');

  // Remove toggle button if exists (when switching away from guru_bidang)
  const existingToggle = document.getElementById(kelasId+'_toggle');
  if(existingToggle) existingToggle.remove();

  if(role==='operator' || role==='penjaga_sekolah'){
    sel.disabled=true; sel.style.opacity='0.5'; sel.value='Semua';
    if(wrap) wrap.style.display='none';
    if(bidangSel){ bidangSel.style.display='none'; bidangSel.value=''; }
    if(bidangWrap) bidangWrap.style.display='none';
    // Reset pengampu layout
    if(wrap && wrap.classList.contains('col-md-6')) wrap.classList.replace('col-md-6','col-12');
  } else if(role==='guru_bidang'){
    if(wrap) wrap.style.display='';
    sel.style.display='none'; // hide the select entirely
    // Populate checkboxes dari select options
    if(cbContainer){
      cbContainer.innerHTML='';
      [...sel.options].forEach(opt=>{
        if(opt.value==='Semua') return;
        const cbId=checkboxId+'_'+opt.value.replace(/\s+/g,'_');
        cbContainer.innerHTML+=`<label style="display:inline-flex;align-items:center;gap:4px;padding:3px 4px;border-radius:6px;cursor:pointer;font-size:12px;user-select:none;white-space:nowrap;">
          <input type="checkbox" value="${opt.value}" id="${cbId}" style="accent-color:var(--primary);width:14px;height:14px;cursor:pointer;">
          ${opt.value}
        </label>`;
      });
      cbContainer.style.display='none';
    }
    // Toggle button
    const toggleId = kelasId+'_toggle';
    let toggleBtn = document.getElementById(toggleId);
    if(!toggleBtn){
      toggleBtn = document.createElement('button');
      toggleBtn.id = toggleId;
      toggleBtn.type='button';
      toggleBtn.style.cssText = 'display:block;background:white;border:1.5px solid #E2E8F0;border-radius:8px;padding:4px 8px;font-size:11px;color:#475569;cursor:pointer;width:100%;text-align:left;';
      toggleBtn.innerHTML = '<i class="bi bi-plus-circle me-1"></i> Pilih Kelas';
      toggleBtn.onclick = function(){
        const cb = document.getElementById(checkboxId);
        if(cb.style.display==='none'||cb.style.display===''){
          cb.style.display='grid';
          toggleBtn.innerHTML = '<i class="bi bi-dash-circle me-1"></i> Tutup Kelas';
        } else {
          cb.style.display='none';
          toggleBtn.innerHTML = '<i class="bi bi-plus-circle me-1"></i> Pilih Kelas';
        }
      };
      sel.parentNode.insertBefore(toggleBtn, cbContainer);
    } else {
      toggleBtn.innerHTML = '<i class="bi bi-plus-circle me-1"></i> Pilih Kelas';
      document.getElementById(checkboxId).style.display='none';
    }
    if(bidangSel){ bidangSel.style.display=''; bidangSel.disabled=false; }
    if(bidangWrap) bidangWrap.style.display='';
    // Guru Bidang: Bidang di sebelah Role, Pengampu col-12 di bawah
    if(wrap && wrap.classList.contains('col-md-6')) wrap.classList.replace('col-md-6','col-12');
    if(wrap && bidangWrap && roleWrap && bidangWrap.parentNode===roleWrap.parentNode){
      if(bidangWrap.nextElementSibling!==wrap) bidangWrap.after(wrap);
    }
  } else {
    sel.disabled=false; sel.style.opacity='1';
    sel.multiple = false;
    sel.removeAttribute('size');
    if(wrap) wrap.style.display='';
    if(bidangSel){ bidangSel.style.display='none'; bidangSel.value=''; }
    if(bidangWrap) bidangWrap.style.display='none';
    // Guru/Kepsek: Pengampu di sebelah Role (col-md-6), Alamat full width
    if(wrap && wrap.classList.contains('col-12')) wrap.classList.replace('col-12','col-md-6');
    if(wrap && roleWrap && roleWrap.parentNode===wrap.parentNode){
      // penataan posisi diatur di blok layout bawah
    }
    if(alamatWrap && !alamatWrap.classList.contains('col-12')) alamatWrap.classList.replace('col-md-6','col-12');
  }
  // Urutan UID / Alamat + lebar UID
  const uidId = isTambah ? 'u_uid' : 'eu_uid';
  const uidW = document.getElementById(uidId)?.closest('.col-md-6,.col-12');
  const alW = document.getElementById(alamatId)?.closest('.col-md-6,.col-12');
  // UID lebar penuh (col-12) untuk Guru/Kepsek & Guru Bidang
  if(role==='guru'||role==='kepala_sekolah'||role==='guru_bidang'){
    if(uidW && !uidW.classList.contains('col-12')) uidW.classList.replace('col-md-6','col-12');
  } else {
    if(uidW && uidW.classList.contains('col-12')) uidW.classList.replace('col-12','col-md-6');
  }
  // Swap posisi UID ↔ Alamat
  if(uidW && alW && uidW.parentNode===alW.parentNode){
    const pr = uidW.parentNode;
    if(role==='guru'||role==='kepala_sekolah'){
      // Guru/Kepsek: UID sebelum Alamat
      if(!(uidW.compareDocumentPosition(alW)&Node.DOCUMENT_POSITION_FOLLOWING)) pr.insertBefore(uidW,alW);
    } else {
      // Non-Guru: Email|UID, Alamat di baris sendiri
      if(alW.compareDocumentPosition(uidW)&Node.DOCUMENT_POSITION_FOLLOWING) pr.insertBefore(uidW,alW);
    }
  }
  // Layout khusus Guru/Kepsek: Nama|NIP, Pengampu|Role, No HP|Email, UID, Alamat
  if(role==='guru'||role==='kepala_sekolah'){
    const namaId = isTambah ? 'u_nama' : 'eu_nama';
    const nipId = isTambah ? 'u_nip' : 'eu_nip';
    const emailId = isTambah ? 'u_email' : 'eu_email';
    const hpId = isTambah ? 'u_nohp' : 'eu_nohp';
    const namaWrap = document.getElementById(namaId)?.closest('.col-md-6');
    const nipW = document.getElementById(nipId)?.closest('.col-md-6');
    const emailW = document.getElementById(emailId)?.closest('.col-md-6');
    const hpW = document.getElementById(hpId)?.closest('.col-md-6');
    const roleW = document.getElementById(roleId)?.closest('.col-md-6');
    const pengampuW = document.getElementById(kelasId)?.closest('.col-md-6,.col-12');
    if(namaWrap && nipW && roleW && hpW && namaWrap.parentNode===nipW.parentNode){
      const p = namaWrap.parentNode;
      const order = [namaWrap, nipW, pengampuW, roleW, bidangWrap, hpW, emailW, uidW, alW];
      for(let i=1;i<order.length;i++){
        const prev = order[i-1];
        const cur  = order[i];
        if(!prev || !cur || prev.parentNode!==p) continue;
        if(prev.nextElementSibling!==cur) p.insertBefore(cur, prev.nextElementSibling);
      }
    }
  }
  // Layout khusus Guru Bidang: Nama|NIP, Role|Bidang, Pengampu(full), No HP|Email, UID, Alamat
  if(role==='guru_bidang'){
    const namaId = isTambah ? 'u_nama' : 'eu_nama';
    const nipId = isTambah ? 'u_nip' : 'eu_nip';
    const emailId = isTambah ? 'u_email' : 'eu_email';
    const hpId = isTambah ? 'u_nohp' : 'eu_nohp';
    const namaWrap = document.getElementById(namaId)?.closest('.col-md-6');
    const nipW = document.getElementById(nipId)?.closest('.col-md-6');
    const emailW = document.getElementById(emailId)?.closest('.col-md-6');
    const hpW = document.getElementById(hpId)?.closest('.col-md-6');
    const roleW = document.getElementById(roleId)?.closest('.col-md-6');
    const pengampuW = document.getElementById(kelasId)?.closest('.col-md-6,.col-12');
    if(namaWrap && nipW && roleW && hpW && namaWrap.parentNode===nipW.parentNode){
      const p = namaWrap.parentNode;
      const order = [namaWrap, nipW, roleW, bidangWrap, pengampuW, hpW, emailW, uidW, alW];
      for(let i=1;i<order.length;i++){
        const prev = order[i-1];
        const cur  = order[i];
        if(!prev || !cur || prev.parentNode!==p) continue;
        if(prev.nextElementSibling!==cur) p.insertBefore(cur, prev.nextElementSibling);
      }
    }
  }
}

let _usersData=[], _usersPage=1, _usersPerPage=5, _usersFiltered=[];

function renderUsersRow(d, i) {
  const ini = d.nama.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const fotoHtml = d.foto
    ? `<img src="${d.foto}" class="foto-sm-img" onclick="showFotoDialog({fotoSrc:'${d.foto.replace(/'/g,"\\'")}',noButtons:true})">`
    : `<div class="foto-sm-ini" onclick="showFotoDialog({fotoSrc:'',noButtons:true})">${ini}</div>`;
  const roleBadge = d.role==='guru_bidang'
    ? `<span style="background:#CFFAFE;color:#0891B2;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap;">${d.bidang_keahlian||'Guru Bidang'}</span>`
    : (ROLE_BADGE[d.role] || d.role);
  return `<tr>
    <td>${d.role!=='operator'?`<input type="checkbox" class="user-check" value="${d.id}" onchange="updateBulkUser()" style="cursor:pointer;accent-color:var(--primary);">`:''}</td>
    <td style="color:var(--gray)">${i+1}</td>
    <td>${fotoHtml}</td>
    <td style="font-weight:700;color:var(--dark);font-size:12.5px;">${d.nama}</td>
    <td style="font-family:monospace;font-size:12px;color:var(--gray);">${d.uid||'-'}</td>
    <td>${roleBadge}</td>
    <td style="font-size:12px;color:var(--gray);text-align:center;">
      ${d.pengampu_kelas && d.pengampu_kelas!=='Semua'
        ? `<i class="bi bi-info-circle-fill" style="cursor:pointer;font-size:15px;color:#0EA5E9;transition:all 0.15s;" onmouseover="this.style.color='#0369A1';this.style.transform='scale(1.2)';" onmouseout="this.style.color='#0EA5E9';this.style.transform='scale(1)';" onclick="showKelasPopup(event,this,'${d.pengampu_kelas.replace(/'/g,"\\'")}')"></i>`
        : '<span style="color:#94A3B8;">-</span>'}
    </td>
    <td style="font-size:12px;color:var(--gray)">${d.nip||'-'}</td>
    <td style="font-size:12px;color:var(--gray)">${d.email||'-'}</td>
    <td style="font-size:12px;color:var(--gray)">${d.no_hp||'-'}</td>
    <td>
      <div class="d-flex gap-1">
        <button class="btn-grad view" title="View" onclick="viewUser(_usersFiltered[${i}])"><i class="bi bi-eye-fill"></i></button>
        <button class="btn-grad edit" title="Edit" onclick="bukaEdit(_usersFiltered[${i}])"><i class="bi bi-pencil-fill"></i></button>
        ${d.role!=='operator'?`<button class="btn-grad hapus" title="Hapus" onclick="hapusUser(${d.id},_usersFiltered[${i}].nama)"><i class="bi bi-trash3-fill"></i></button>`:''}
      </div>
    </td>
  </tr>`;
}

function renderUsersPage(){
  const search = (document.getElementById('searchUsers').value||'').toLowerCase();
  document.getElementById('totalUsersBadge').textContent=_usersData.length;
  _usersFiltered = _usersData;
  if(search){
    _usersFiltered = _usersData.filter(u=>
      (u.nama||'').toLowerCase().includes(search) ||
      (u.role||'').toLowerCase().includes(search) ||
      (u.pengampu_kelas||'').toLowerCase().includes(search) ||
      (u.nip||'').toLowerCase().includes(search) ||
      (u.email||'').toLowerCase().includes(search) ||
      (u.no_hp||'').toLowerCase().includes(search) ||
      (u.bidang_keahlian||'').toLowerCase().includes(search) ||
      (u.uid||'').toLowerCase().includes(search)
    );
  }
  const tbody=document.getElementById('tblUsers');
  if(!_usersFiltered.length){
    tbody.innerHTML=search
      ? '<tr><td colspan="11"><div class="empty-state"><i class="bi bi-people"></i><p>Tidak ditemukan</p></div></td></tr>'
      : '<tr><td colspan="11"><div class="empty-state"><i class="bi bi-people"></i><p>Belum ada pengguna</p></div></td></tr>';
    document.getElementById('pagination').style.display='none';
    return;
  }
  const pp=_usersPerPage;
  const totalPages=Math.ceil(_usersFiltered.length/pp);
  if(_usersPage>totalPages) _usersPage=totalPages;
  const start=(_usersPage-1)*pp;
  const end=Math.min(start+pp,_usersFiltered.length);
  tbody.innerHTML=_usersFiltered.slice(start,end).map((u,i)=>renderUsersRow(u,start+i)).join('');
  document.getElementById('selectAllUser').checked=false;
  updateBulkUser();
  buildPaginationUI('pagination',{
    currentPage:_usersPage, totalPages, currentSize:_usersPerPage,
    sizes:[5,10,15,20,25,50],
    onPageChange:p=>{_usersPage=p;renderUsersPage();},
    onSizeChange:s=>{_usersPerPage=s;_usersPage=1;renderUsersPage();}
  });
}

async function loadUsers(){
  const res=await fetchAPI('/api/users');
  if(!res) return;
  _usersData=res.data||[];
  renderRoleCards(_usersData);
  _usersPage=1;
  renderUsersPage();
}

function renderRoleCards(data){
  const roles=[
    {key:'operator',       icon:'bi-person-badge-fill',    label:'Operator',    color:'#2563EB'},
    {key:'guru',           icon:'bi-mortarboard-fill',     label:'Guru',        color:'#059669'},

    {key:'penjaga_sekolah',icon:'bi-shield-fill',          label:'Penjaga',     color:'#D97706'},
    {key:'guru_bidang',    icon:'bi-book-half',            label:'Guru Bidang', color:'#0891B2'},
  ];

  document.getElementById('tambah-foto-preview').innerHTML=`<div class="foto-ini-lg"><i class="bi bi-person-fill" style="font-size:32px;"></i></div>`;

async function simpanUser(){
  const alertEl=document.getElementById('alertTambah');
  const required = [
    {id:'u_nama', l:'Nama Lengkap'},
    {id:'u_role', l:'Role'},
    {id:'u_nohp', l:'No HP'}, {id:'u_nip', l:'NIP'},
    {id:'u_email', l:'Email'}, {id:'u_alamat', l:'Alamat'}
  ];
  for(const f of required){
    const el=document.getElementById(f.id);
    if(!el.value||!el.value.trim()){alertEl.innerHTML=`<div class="alert-msg error">${f.l} wajib diisi</div>`;el.focus();return;}
  }
  const u_uid=document.getElementById('u_uid').value.trim();
  if(!u_uid||u_uid.length!==10){alertEl.innerHTML='<div class="alert-msg error">UID Kartu wajib diisi 10 digit</div>';document.getElementById('u_uid').focus();return;}
  if(document.getElementById('u_role').value==='guru_bidang'){
    const b=document.getElementById('u_bidang');
    if(!b.value){alertEl.innerHTML=`<div class="alert-msg error">Bidang Keahlian wajib diisi</div>`;b.focus();return;}
  }
  const fd=new FormData();
  fd.append('nama',document.getElementById('u_nama').value.trim());
  fd.append('role',document.getElementById('u_role').value);
  const cbContainer = document.getElementById('u_pengampu_checkboxes');
  let pengampuVal;
  if(document.getElementById('u_role').value==='guru_bidang'){
    const checked=[...cbContainer.querySelectorAll('input[type="checkbox"]:checked')].map(cb=>cb.value);
    pengampuVal=checked.length?checked.join(','):'Semua';
  } else if(cbContainer && cbContainer.style.display!=='none'){
    const checked=[...cbContainer.querySelectorAll('input[type="checkbox"]:checked')].map(cb=>cb.value);
    pengampuVal=checked.length?checked.join(','):'Semua';
  } else {
    const pengampuSel = document.getElementById('u_pengampu');
    pengampuVal = pengampuSel.value||'Semua';
  }
  fd.append('pengampu_kelas',pengampuVal);
  fd.append('no_hp',document.getElementById('u_nohp').value);
  fd.append('email',document.getElementById('u_email').value);
  fd.append('nip',document.getElementById('u_nip').value.trim());
  fd.append('alamat',document.getElementById('u_alamat').value.trim());
  fd.append('bidang_keahlian',document.getElementById('u_bidang').value);
  fd.append('uid',u_uid);
  if(tambahUserBlob) fd.append('foto',tambahUserBlob,'foto.png');
  const {isConfirmed:konfirmTambah}=await Swal.fire({title:'Konfirmasi Simpan',text:'Apakah data yang diisi sudah benar?',icon:'question',showCancelButton:true,confirmButtonText:'Ya, Simpan',cancelButtonText:'Batal',confirmButtonColor:'#2563EB',cancelButtonColor:'#1E293B',reverseButtons:true,width:'300px',padding:'16px',customClass:{popup:'swal-kecil',title:'swal-title-kecil',htmlContainer:'swal-text-kecil',confirmButton:'swal-btn-kecil',cancelButton:'swal-btn-kecil'}});
  if(!konfirmTambah) return;
  const res=await fetchAPI('/api/users/tambah','POST',fd);
  if(res?.success){closeModal('modalTambah');showToast('Pengguna ditambahkan!','success');tambahUserBlob=null;loadUsers();alertEl.innerHTML='';}
  else alertEl.innerHTML=`<div class="alert-msg error">${res?.message||'Gagal'}</div>`;
}

let _viewUserData=null;

function checkUIDLive(inp){
  const val = inp.value.trim();
  const isEdit = inp.id === 'eu_uid';
  const excludeId = isEdit ? editUserId : null;
  const duplicate = val.length >= 3 && _usersData.some(u => u.uid === val && u.id !== excludeId);
  const label = inp.previousElementSibling;
  let errEl = label.querySelector('.uid-error');
  if(duplicate){
    if(!errEl){
      errEl = document.createElement('span');
      errEl.className = 'uid-error';
      errEl.style.cssText = 'color:#DC2626;font-size:10.5px;font-weight:400;margin-left:6px;';
      errEl.textContent = 'UID sudah digunakan!';
      label.appendChild(errEl);
    }
  } else {
    if(errEl) errEl.remove();
  }
}

function viewUser(d){
  _viewUserData=d;
  const ini = d.nama.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const fotoHtml = d.foto
    ? `<img src="${d.foto}" style="width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid #E2E8F0;display:block;margin:0 auto;cursor:pointer;" onclick="showFotoDialog({fotoSrc:'${(d.foto||'').replace(/'/g,"\\'")}',noButtons:true})">`
    : `<div style="width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#DBEAFE,#EDE9FE);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#2563EB;border:2px solid #E2E8F0;margin:0 auto;cursor:pointer;" onclick="showFotoDialog({fotoSrc:'',noButtons:true})">${ini}</div>`;
  const roleLabel = {kepala_sekolah:'Kepala Sekolah',guru:'Guru',operator:'Operator',penjaga_sekolah:'Penjaga Sekolah',guru_bidang:'Guru Bidang'}[d.role]||d.role;
  const r = (label, val) => `<div style="padding:4px 0;border-bottom:1px solid #F1F5F9;"><div style="color:var(--gray);font-size:10.5px;font-weight:500;">${label}</div><div style="font-weight:600;font-size:12.5px;">${val||'-'}</div></div>`;
  const role = d.role;
  let leftCol, rightCol, fullWidth;
  if(role==='guru'||role==='kepala_sekolah'){
    leftCol = r('Nama Lengkap',d.nama)+r('Pengampu Kelas',d.pengampu_kelas||'-')+r('No. HP',d.no_hp);
    rightCol = r('NIP',d.nip)+r('Role',roleLabel)+r('Email',d.email);
    fullWidth = r('UID Kartu',d.uid||'-')+r('Alamat',d.alamat);
  } else if(role==='guru_bidang'){
    leftCol = r('Nama Lengkap',d.nama)+r('Role',roleLabel)+r('No. HP',d.no_hp);
    rightCol = r('NIP',d.nip)+r('Bidang Keahlian',d.bidang_keahlian||'-')+r('Email',d.email);
    fullWidth = r('UID Kartu',d.uid||'-')+r('Pengampu Kelas',d.pengampu_kelas||'-')+r('Alamat',d.alamat);
  } else {
    leftCol = r('Nama Lengkap',d.nama)+r('No. HP',d.no_hp)+r('Email',d.email);
    rightCol = r('Role',roleLabel)+r('NIP',d.nip)+r('UID Kartu',d.uid||'-');
    fullWidth = r('Pengampu Kelas',d.pengampu_kelas||'-')+r('Alamat',d.alamat);
  }
  document.getElementById('viewUserBody').innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:12px;">${fotoHtml}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
      <div>${leftCol}</div>
      <div>${rightCol}</div>
    </div>
    ${fullWidth}`;
  openModal('modalViewUser');
}

async function bukaEdit(u){
  editUserId=u.id;editUserBlob=null;editUserFotoSrc=u.foto||'';
  document.getElementById('eu_id').value=u.id;
  document.getElementById('eu_nama').value=u.nama;
  document.getElementById('eu_role').value=u.role;
  document.getElementById('eu_nohp').value=u.no_hp||'';
  document.getElementById('eu_email').value=u.email||'';
  document.getElementById('eu_nip').value=u.nip||'';
  document.getElementById('eu_alamat').value=u.alamat||'';
  document.getElementById('eu_bidang').value=u.bidang_keahlian||'';
  document.getElementById('eu_uid').value=u.uid||'';
  checkUIDLive(document.getElementById('eu_uid'));
  document.getElementById('alertEdit').innerHTML='';
  await isiKelasOptions('eu_pengampu');
  toggleKelasSelect('eu_pengampu','eu_role');
  const cbContainer = document.getElementById('eu_pengampu_checkboxes');
  const role = document.getElementById('eu_role').value;
  if(role==='guru_bidang' || (cbContainer && cbContainer.style.display!=='none')){
    const vals = (u.pengampu_kelas||'').split(',').map(v=>v.trim());
    cbContainer.querySelectorAll('input[type="checkbox"]').forEach(cb=>{
      cb.checked = vals.includes(cb.value);
    });
  } else {
    const pengampuSel = document.getElementById('eu_pengampu');
    if(u.pengampu_kelas && u.pengampu_kelas!=='Semua'){
      pengampuSel.value = u.pengampu_kelas;
    }
  }
  const ini=u.nama.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  document.getElementById('edit-foto-preview').innerHTML=u.foto
    ?`<img src="${u.foto}" class="foto-circle-lg" onerror="this.outerHTML='<div class=\\'foto-ini-lg\\'>${ini}</div>'">`
    :`<div class="foto-ini-lg">${ini}</div>`;
  openModal('modalEdit');
}

async function updateUser(){
  const alertEl=document.getElementById('alertEdit');
  const required = [
    {id:'eu_nama', l:'Nama Lengkap'},
    {id:'eu_role', l:'Role'}, {id:'eu_nohp', l:'No HP'},
    {id:'eu_nip', l:'NIP'}, {id:'eu_email', l:'Email'},
    {id:'eu_alamat', l:'Alamat'}
  ];
  for(const f of required){
    const el=document.getElementById(f.id);
    if(!el.value||!el.value.trim()){alertEl.innerHTML=`<div class="alert-msg error">${f.l} wajib diisi</div>`;el.focus();return;}
  }
  const eu_uid=document.getElementById('eu_uid').value.trim();
  if(!eu_uid||eu_uid.length!==10){alertEl.innerHTML='<div class="alert-msg error">UID Kartu wajib diisi 10 digit</div>';document.getElementById('eu_uid').focus();return;}
  if(document.getElementById('eu_role').value==='guru_bidang'){
    const b=document.getElementById('eu_bidang');
    if(!b.value){alertEl.innerHTML=`<div class="alert-msg error">Bidang Keahlian wajib diisi</div>`;b.focus();return;}
  }
  const fd=new FormData();
  fd.append('id',document.getElementById('eu_id').value);
  fd.append('nama',document.getElementById('eu_nama').value.trim());
  fd.append('role',document.getElementById('eu_role').value);
  const cbContainer = document.getElementById('eu_pengampu_checkboxes');
  let pengampuVal;
  if(document.getElementById('eu_role').value==='guru_bidang'){
    const checked=[...cbContainer.querySelectorAll('input[type="checkbox"]:checked')].map(cb=>cb.value);
    pengampuVal=checked.length?checked.join(','):'Semua';
  } else if(cbContainer && cbContainer.style.display!=='none'){
    const checked=[...cbContainer.querySelectorAll('input[type="checkbox"]:checked')].map(cb=>cb.value);
    pengampuVal=checked.length?checked.join(','):'Semua';
  } else {
    const pengampuSel = document.getElementById('eu_pengampu');
    pengampuVal = pengampuSel.value||'Semua';
  }
  fd.append('pengampu_kelas',pengampuVal);
  fd.append('no_hp',document.getElementById('eu_nohp').value);
  fd.append('email',document.getElementById('eu_email').value);
  fd.append('nip',document.getElementById('eu_nip').value.trim());
  fd.append('alamat',document.getElementById('eu_alamat').value.trim());
  fd.append('bidang_keahlian',document.getElementById('eu_bidang').value);
  fd.append('uid',eu_uid);
  if(editUserBlob) fd.append('foto',editUserBlob,'foto.png');
  const {isConfirmed:konfirmEdit}=await Swal.fire({title:'Konfirmasi Update',text:'Apakah perubahan data sudah benar?',icon:'question',showCancelButton:true,confirmButtonText:'Ya, Update',cancelButtonText:'Batal',confirmButtonColor:'#F59E0B',cancelButtonColor:'#1E293B',reverseButtons:true,width:'300px',padding:'16px',customClass:{popup:'swal-kecil',title:'swal-title-kecil',htmlContainer:'swal-text-kecil',confirmButton:'swal-btn-kecil',cancelButton:'swal-btn-kecil'}});
  if(!konfirmEdit) return;
  const res=await fetchAPI('/api/users/edit','POST',fd);
  if(res?.success){closeModal('modalEdit');showToast('Pengguna diperbarui!','success');editUserBlob=null;loadUsers();}
  else alertEl.innerHTML=`<div class="alert-msg error">${res?.message||'Gagal'}</div>`;
}

function showKelasPopup(e,icon,kelas){
  const existing=document.querySelector('.kelas-popup');
  if(existing){
    if(existing._icon===icon){existing.remove();return;}
    existing.remove();
  }
  const popup=document.createElement('div');
  popup.className='kelas-popup';
  popup._icon=icon;
  popup.textContent=kelas;
  const close=document.createElement('button');
  close.className='kelas-popup-close';
  close.innerHTML='<i class="bi bi-x" style="font-size:10px;line-height:1;"></i>';
  close.onclick=function(ev){ev.stopPropagation();popup.remove();};
  popup.appendChild(close);
  document.body.appendChild(popup);
  const r=popup.getBoundingClientRect();
  let x=e.clientX, y=e.clientY-36;
  if(x+r.width>document.documentElement.clientWidth-5) x=document.documentElement.clientWidth-r.width-5;
  if(y<5) y=e.clientY+10;
  popup.style.left=x+'px'; popup.style.top=y+'px';
  const outsideClick=function(ev){if(!popup.contains(ev.target)){popup.remove();document.removeEventListener('click',outsideClick,true);}};
  document.addEventListener('click',outsideClick,true);
}
// Modal Update UID Massal
let _uidEditMode=false;

function toggleEditUidMassal(){
  _uidEditMode=!_uidEditMode;
  const btn=document.getElementById('toggleEditUidBtn');
  const inputs=document.querySelectorAll('.uid-massal-input');
  inputs.forEach(inp=>{
    if(_uidEditMode){inp.removeAttribute('disabled');inp.style.background='#fff';checkUIDLiveMassal(inp);}
    else{inp.setAttribute('disabled','');inp.style.background='#F1F5F9';}
  });
  btn.innerHTML=_uidEditMode?'Lihat':'Edit';
}

function checkUIDLiveMassal(inp){
  const val=inp.value.trim();
  const currentId=parseInt(inp.dataset.id);
  const duplicate=val.length>=3&&_usersData.some(u=>u.uid===val&&u.id!==currentId);
  const errorEl=inp.parentElement.querySelector('.uid-massal-error');
  if(duplicate){
    errorEl.style.display='inline';
    inp.style.borderColor='#DC2626';
  } else {
    errorEl.style.display='none';
    inp.style.borderColor='';
  }
}

function filterUidMassal(q){
  const keyword=q.toLowerCase().trim();
  const rows=document.querySelectorAll('#uidMassalBody > .uid-row');
  let visible=0;
  rows.forEach(row=>{
    const nama=row.querySelector('.uid-row-nama')?.textContent.toLowerCase()||'';
    const uid=row.querySelector('.uid-massal-input')?.value.toLowerCase()||'';
    const match=!keyword||nama.includes(keyword)||uid.includes(keyword);
    row.classList.toggle('uid-hidden',!match);
    if(match) visible++;
  });
  document.getElementById('uidMassalCount').textContent=`${visible} pengguna`;
}

function bukaModalUidMassal(){
  _uidEditMode=false;
  document.getElementById('uidSearchMassal').value='';
  document.getElementById('clearUidSearch').style.display='none';
  const body=document.getElementById('uidMassalBody');
  body.innerHTML=_usersData.map((u,i)=>`
    <div class="uid-row" style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #F1F5F9;">
      <div style="flex-shrink:0;width:32px;font-size:11px;color:var(--gray);font-weight:600;text-align:center;">${i+1}</div>
      <div style="flex-shrink:0;">${
        u.foto
          ? `<img src="${u.foto}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid #E2E8F0;">`
          : `<div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#DBEAFE,#EDE9FE);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#2563EB;border:1px solid #E2E8F0;">${u.nama.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()||'?'}</div>`
      }</div>
      <div class="uid-row-nama" style="flex:1;font-size:12px;font-weight:600;">${u.nama}</div>
      <div style="display:flex;flex-direction:column;gap:2px;flex-shrink:0;">
        <input type="text" class="form-control-modern uid-massal-input" data-id="${u.id}" value="${u.uid||''}" placeholder="10 digit" maxlength="10" style="width:110px;padding:3px 6px;font-size:11px;font-family:monospace;background:#F1F5F9;" disabled oninput="this.value=this.value.replace(/\D/g,'');checkUIDLiveMassal(this)">
        <span class="uid-massal-error" style="display:none;color:#DC2626;font-size:10.5px;font-weight:400;">UID sudah digunakan!</span>
      </div>
    </div>
  `).join('');
  document.getElementById('toggleEditUidBtn').innerHTML='Edit';
  document.getElementById('uidMassalCount').textContent=`${_usersData.length} pengguna`;
  openModal('modalUidMassal');
}

function closeModalUidMassal(){
  const inputs=document.querySelectorAll('.uid-massal-input');
  let adaPerubahan=false;
  for(const inp of inputs){
    const val=inp.value.trim();
    const user=_usersData.find(u=>u.id==inp.dataset.id);
    if(user&&(user.uid||'')!==val){adaPerubahan=true;break;}
  }
  if(!adaPerubahan){closeModal('modalUidMassal');return;}
  Swal.fire({text:'Apakah anda yakin ingin membatalkan perubahan?',icon:'question',showCancelButton:true,confirmButtonText:'Discard',cancelButtonText:'Lanjut Edit',confirmButtonColor:'#EF4444',cancelButtonColor:'#1E293B',reverseButtons:true,width:'300px',padding:'16px',customClass:{popup:'swal-kecil',htmlContainer:'swal-text-kecil',confirmButton:'swal-btn-kecil',cancelButton:'swal-btn-kecil'}}).then(r=>{if(r.isConfirmed)closeModal('modalUidMassal');});
}

async function simpanUidMassal(){
  const inputs=document.querySelectorAll('.uid-massal-input');
  const updates=[];
  for(const inp of inputs){
    const uid=inp.value.trim();
    if(uid&&uid.length!==10){showToast('UID harus 10 digit!','error');inp.focus();return;}
    const user=_usersData.find(u=>u.id==inp.dataset.id);
    if(!user) continue;
    if((user.uid||'')===uid) continue;
    updates.push({...user,uid});
  }
  if(!updates.length){showToast('Tidak ada perubahan UID','info');closeModal('modalUidMassal');return;}
  for(const inp of inputs){
    const errEl=inp.parentElement.querySelector('.uid-massal-error');
    if(errEl&&errEl.style.display!=='none'){showToast('UID '+inp.value.trim()+' sudah digunakan oleh pengguna lain!','error');inp.focus();return;}
  }
  const {isConfirmed:konfirm}=await Swal.fire({title:'Konfirmasi Update UID',text:`${updates.length} pengguna akan diperbarui UID-nya.`,icon:'question',showCancelButton:true,confirmButtonText:'Ya, Update',cancelButtonText:'Batal',confirmButtonColor:'#7C3AED',cancelButtonColor:'#1E293B',reverseButtons:true,width:'300px',padding:'16px',customClass:{popup:'swal-kecil',title:'swal-title-kecil',htmlContainer:'swal-text-kecil',confirmButton:'swal-btn-kecil',cancelButton:'swal-btn-kecil'}});
  if(!konfirm) return;
  let sukses=0, gagal=0, errMsg='';
  for(const u of updates){
    const fd=new FormData();
    ['id','nama','role','no_hp','email','pengampu_kelas','nip','alamat','bidang_keahlian','uid'].forEach(k=>fd.append(k,u[k]||''));
    const res=await fetchAPI('/api/users/edit','POST',fd);
    if(res?.success){sukses++;const user=_usersData.find(x=>x.id==u.id);if(user) user.uid=u.uid;}
    else{gagal++;errMsg=res?.message||'Gagal terhubung ke server';}
  }
  if(gagal) showToast(`${sukses} berhasil, ${gagal} gagal: ${errMsg}`,'error');
  else showToast(`${sukses} UID diperbarui`,'success');
  closeModal('modalUidMassal');
  loadUsers();
}
