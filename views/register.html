<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi â€” Presensi SDN Karangpawitan 1</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-bg-shapes">
    <div class="shape" style="width:300px;height:300px;top:-100px;right:-100px;"></div>
    <div class="shape" style="width:200px;height:200px;bottom:-60px;left:-60px;"></div>
  </div>
  <div class="login-card" style="max-width:460px;">
    <div class="login-logo">
      <div class="login-logo-icon"><i class="bi bi-person-plus-fill"></i></div>
      <div class="login-title">Daftar Operator Baru</div>
      <div class="login-subtitle">SDN Karangpawitan 1</div>
    </div>
    <div id="alert-msg"></div>
    <div class="form-group-login">
      <label class="form-label-modern">Nama Lengkap</label>
      <div class="input-icon-wrapper">
        <i class="bi bi-person input-icon"></i>
        <input type="text" id="nama" class="form-control-modern" placeholder="Nama lengkap">
      </div>
    </div>
    <div class="form-group-login">
      <label class="form-label-modern">Username</label>
      <div class="input-icon-wrapper">
        <i class="bi bi-at input-icon"></i>
        <input type="text" id="username" class="form-control-modern" placeholder="Username login">
      </div>
    </div>
    <div class="form-group-login">
      <label class="form-label-modern">Password</label>
      <div class="input-icon-wrapper">
        <i class="bi bi-lock input-icon"></i>
        <input type="password" id="password" class="form-control-modern" placeholder="Min. 6 karakter">
      </div>
    </div>
    <div class="form-group-login">
      <label class="form-label-modern">Konfirmasi Password</label>
      <div class="input-icon-wrapper">
        <i class="bi bi-lock-fill input-icon"></i>
        <input type="password" id="konfirmasi" class="form-control-modern" placeholder="Ulangi password">
      </div>
    </div>
    <button class="btn-login mt-2" id="btnReg" onclick="doRegister()">
      <i class="bi bi-person-check me-2"></i>Daftar Sekarang
    </button>
    <div class="text-center mt-3">
      <a href="/login" style="color:var(--primary);font-size:13.5px;font-weight:600;text-decoration:none;">
        <i class="bi bi-arrow-left me-1"></i>Kembali ke Login
      </a>
    </div>
  </div>
</div>
<script>
async function doRegister() {
  const btn = document.getElementById('btnReg');
  const alertEl = document.getElementById('alert-msg');
  const body = {
    nama: document.getElementById('nama').value.trim(),
    username: document.getElementById('username').value.trim(),
    password: document.getElementById('password').value,
    konfirmasi: document.getElementById('konfirmasi').value
  };
  btn.disabled = true;
  btn.innerHTML = '<span style="display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px;"></span>Memproses...';
  try {
    const res = await fetch('/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await res.json();
    if (data.success) {
      alertEl.innerHTML = `<div class="alert-msg success"><i class="bi bi-check-circle me-2"></i>${data.message} <a href="/login" style="color:#065F46;font-weight:700;">Klik di sini untuk login</a></div>`;
    } else {
      alertEl.innerHTML = `<div class="alert-msg error"><i class="bi bi-exclamation-circle me-2"></i>${data.message}</div>`;
    }
  } catch(e) { alertEl.innerHTML = `<div class="alert-msg error">Koneksi error.</div>`; }
  btn.disabled = false;
  btn.innerHTML = '<i class="bi bi-person-check me-2"></i>Daftar Sekarang';
}
</script>
</body>
</html>
