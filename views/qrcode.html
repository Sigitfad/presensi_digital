<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Cetak QR Code</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;}
    .qr-card-item{border:2px solid #E2E8F0;border-radius:14px;padding:16px 12px 12px;text-align:center;background:white;transition:var(--transition);}
    .qr-card-item:hover{border-color:var(--primary);box-shadow:var(--shadow-md);transform:translateY(-2px);}
    .qr-school-name{font-size:12px;font-weight:800;color:var(--primary);margin-bottom:10px;}
    .qr-canvas-wrap{display:flex;justify-content:center;margin:4px 0 10px;}
    .qr-sname{font-weight:800;font-size:13px;color:var(--dark);line-height:1.3;}
    .qr-sdetail{font-size:11.5px;color:var(--gray);margin-top:3px;}
    .qr-snis{font-size:12px;font-weight:700;color:var(--primary);margin-top:3px;}
    .qr-actions{display:flex;gap:6px;margin-top:10px;}
    .qr-btn{flex:1;padding:6px 0;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;transition:var(--transition);display:flex;align-items:center;justify-content:center;gap:4px;}
    .qr-btn-dl{background:var(--primary-light);color:var(--primary);}
    .qr-btn-dl:hover{background:var(--primary);color:white;}
    .qr-btn-print{background:#F1F5F9;color:#475569;}
    .qr-btn-print:hover{background:#E2E8F0;}
    #dl-canvas{display:none;}
    @media print{
      #sidebar,#topbar,footer,.no-print{display:none!important;}
      #main-content{margin-left:0!important;}
      .qr-grid{grid-template-columns:repeat(4,1fr)!important;gap:10px!important;}
      .qr-actions{display:none!important;}
    }
  </style>
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script></head>
<body>
<canvas id="dl-canvas"></canvas>
<div id="page-content" class="page-content">
  <div class="page-header d-flex align-items-center justify-content-between flex-wrap gap-2">
    <div>
      <div class="page-title" id="page-title-qr">Cetak QR Code</div>
      <div class="page-subtitle" id="page-sub-qr">Generate dan cetak QR Code untuk semua siswa</div>
    </div>
    <button class="btn-primary-custom no-print" onclick="window.print()">
      <i class="bi bi-printer"></i> Cetak Semua
    </button>
  </div>

  <!-- Filter -->
  <div class="card-modern mb-3 no-print">
    <div class="card-modern-body d-flex gap-2 flex-wrap align-items-center">
      <select id="filterKelas" class="form-control-modern" style="width:160px;" onchange="loadQR()">
        <option value="">Semua Kelas</option>
      </select>
      <input type="text" id="searchSiswa" class="form-control-modern"
             placeholder="Cari nama siswa..." style="width:200px;" oninput="clearTimeout(window._dQ);window._dQ=setTimeout(()=>loadQR(),300)">
      <span id="qr-count" style="font-size:13px;color:var(--gray)"></span>
    </div>
  </div>

  <div class="card-modern">
    <div class="card-modern-body">
      <div class="qr-grid" id="qrGrid">
        <div style="grid-column:1/-1;text-align:center;padding:40px;"><div class="loading-spinner"></div></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/js/app.js?v=5"></script>
<script>
let SCHOOL_NAME = 'SDN Karangpawitan 1';
let _pengampuKelas = 'Semua';

async function loadQR(){
  const kelas  = document.getElementById('filterKelas').value;
  const search = document.getElementById('searchSiswa').value;
  const grid   = document.getElementById('qrGrid');
  grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;"><div class="loading-spinner"></div></div>';

  const params = new URLSearchParams({kelas,search});
  const res    = await fetchAPI(`/api/siswa?${params}`);
  if(!res) return;
  const data   = res.data||[];

  document.getElementById('qr-count').textContent=`${data.length} siswa`;

  if(!data.length){
    grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--gray);">
      <i class="bi bi-people" style="font-size:40px;opacity:0.3;display:block;margin-bottom:10px;"></i>
      Tidak ada siswa ditemukan
    </div>`;
    return;
  }

  grid.innerHTML=data.map(s=>`
    <div class="qr-card-item" id="card-${s.id}">
      <div class="qr-school-name">${SCHOOL_NAME}</div>
      <div class="qr-canvas-wrap"><div id="qr-${s.id}"></div></div>
      <div class="qr-sname">${s.nama}</div>
      <div class="qr-sdetail">${s.kelas} &bull; ${s.jenis_kelamin==='Laki-laki'?'L':'P'}</div>
      <div class="qr-snis">NISN: ${s.nisn}</div>
      <div class="qr-actions no-print">
        <button class="qr-btn qr-btn-dl"
                onclick="downloadQRCard('${s.id}','${s.nisn}','${s.nama.replace(/'/g,"\\'")}','${s.kelas}','${s.jenis_kelamin}')">
          <i class="bi bi-download"></i> Download
        </button>
        <button class="qr-btn qr-btn-print" onclick="cetakSatu('${s.id}','${s.nisn}','${s.nama.replace(/'/g,"\\'")}','${s.kelas}','${s.jenis_kelamin}')">
          <i class="bi bi-printer"></i>
        </button>
      </div>
    </div>`).join('');

  data.forEach(s=>{
    new QRCode(document.getElementById(`qr-${s.id}`),{
      text:s.nisn, width:130, height:130,
      colorDark:'#1E293B', colorLight:'#ffffff',
      correctLevel:QRCode.CorrectLevel.H
    });
  });
}

async function downloadQRCard(id,nisn,nama,kelas,jk){
  await new Promise(r=>setTimeout(r,200));
  const qrCanvas=document.querySelector(`#qr-${id} canvas`);
  if(!qrCanvas){showToast('QR belum siap','error');return;}
  // 85.6mm x 54mm = ukuran kartu standar (CR80) — skala 10x untuk kualitas cetak
  const W=856,H=540,PAD=42;
  const canvas=document.getElementById('dl-canvas');
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H);
  // Header bar
  const grad=ctx.createLinearGradient(0,0,W,0);
  grad.addColorStop(0,'#1E3A8A'); grad.addColorStop(1,'#2563EB');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,12);
  // Logo lingkaran
  const iSz=70,iY=32;
  ctx.beginPath(); ctx.arc(W/2,iY+iSz/2,iSz/2,0,Math.PI*2); ctx.fillStyle='#2563EB'; ctx.fill();
  ctx.fillStyle='#FFFFFF'; ctx.font='bold 30px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('S',W/2,iY+iSz/2);
  // Nama sekolah
  ctx.fillStyle='#1E3A8A'; ctx.font='bold 18px Arial'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillText(SCHOOL_NAME,W/2,iY+iSz+22);
  // Garis pemisah
  ctx.strokeStyle='#E2E8F0'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(PAD,iY+iSz+34); ctx.lineTo(W-PAD,iY+iSz+34); ctx.stroke();
  // QR Code (ukuran lebih besar)
  const qS=260,qX=(W-qS)/2,qY=iY+iSz+48;
  ctx.strokeStyle='#E2E8F0'; ctx.lineWidth=1.5;
  roundRect(ctx,qX-12,qY-12,qS+24,qS+24,14); ctx.stroke();
  ctx.drawImage(qrCanvas,qX,qY,qS,qS);
  // Nama siswa
  const nY=qY+qS+36;
  ctx.fillStyle='#1E293B'; ctx.font='bold 26px Arial'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  let dn=nama; while(ctx.measureText(dn).width>W-PAD*2&&dn.length>5) dn=dn.slice(0,-1); if(dn!==nama) dn+='...';
  ctx.fillText(dn,W/2,nY);
  // Kelas & JK
  ctx.fillStyle='#64748B'; ctx.font='16px Arial';
  ctx.fillText(`${kelas}  \u2022  ${jk}`,W/2,nY+26);
  // NISN badge
  const bW=200,bH=40,bX=(W-bW)/2,bY=nY+42;
  ctx.fillStyle='#DBEAFE'; roundRect(ctx,bX,bY,bW,bH,20); ctx.fill();
  ctx.fillStyle='#2563EB'; ctx.font='bold 16px Arial'; ctx.textBaseline='middle';
  ctx.fillText(`NISN: ${nisn}`,W/2,bY+bH/2);
  // Footer
  ctx.fillStyle='#94A3B8'; ctx.font='13px Arial'; ctx.textBaseline='alphabetic';
  ctx.fillText('Sistem Presensi Digital',W/2,H-18);
  const a=document.createElement('a'); a.download=`QR_${nisn}_${nama.replace(/\s+/g,'_')}.png`; a.href=canvas.toDataURL('image/png',1.0); a.click();
  showToast(`QR ${nama} didownload!`,'success');
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

function cetakSatu(id,nisn,nama,kelas,jk){
  const canvas=document.querySelector(`#qr-${id} canvas`);
  if(!canvas) return;
  const win=window.open('','_blank','width=400,height=600');
  win.document.write(`<html><head>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net"><title>QR ${nama}</title><style>
    @page{size:85.6mm 54mm;margin:0;}
    body{font-family:Arial,sans-serif;text-align:center;padding:10px;background:white;margin:0;}
    .school{font-size:11px;font-weight:bold;color:#1E3A8A;margin-bottom:4px;}
    img{width:120px;height:120px;}
    .name{font-size:14px;font-weight:bold;margin-top:6px;}
    .info{font-size:10px;color:#666;margin-top:2px;}
    .nisn{font-size:10px;font-weight:bold;color:#2563EB;margin-top:2px;}
  </style>  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script></head>
  <body><div class="school">${SCHOOL_NAME}</div>
  <img src="${canvas.toDataURL()}">
  <div class="name">${nama}</div>
  <div class="info">${kelas} &bull; ${jk==='Laki-laki'?'L':'P'}</div>
  <div class="nisn">NISN: ${nisn}</div>
  <script>window.onload=()=>window.print();<\/script></body></html>`);
  win.document.close();
}

async function init(){
  await loadLayout('qrcode','Cetak QR Code');
  await loadKelasOptions('filterKelas', true);
  const session=window._session||{};
  _pengampuKelas=session.pengampuKelas||'Semua';
  SCHOOL_NAME=(await fetchAPI('/api/identitas'))?.data?.nama_sekolah||'SDN Karangpawitan 1';

  if(session.role!=='operator' && _pengampuKelas!=='Semua'){
    document.getElementById('page-title-qr').textContent=`QR Code Siswa - Pengampu ${_pengampuKelas}`;
    document.getElementById('page-sub-qr').textContent=`Generate dan cetak QR Code untuk semua siswa ${_pengampuKelas}`;
    const fk=document.getElementById('filterKelas');
    if(_pengampuKelas.includes(',')){
      const list=_pengampuKelas.split(',').map(k=>k.trim()).filter(Boolean);
      fk.innerHTML='<option value="">Semua Kelas</option>'+list.map(k=>`<option value="${k}">${k}</option>`).join('');
      fk.value='';
    } else {
      fk.value=_pengampuKelas;
      fk.disabled=true;
      fk.style.opacity='0.6';
    }
  }
  loadQR();
}
init();
</script>
</body>
</html>
