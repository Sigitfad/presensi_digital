<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOGIN</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .login-tabs{display:flex;gap:0;margin-bottom:16px;border-radius:10px;overflow:hidden;border:1.5px solid #E2E8F0;background:#F8FAFC;}
    .login-tab{flex:1;padding:8px 12px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;color:#94A3B8;background:transparent;border:none;transition:all 0.2s;}
    .login-tab.active{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,0.06);}
    .login-tab i{margin-right:6px;}
    .login-tab-content{display:none;}
    .login-tab-content.active{display:block;}
  </style>
</head>
<body>
<div class="login-page">

  <div class="login-card">
    <div class="login-logo">
      <div id="loginLogo"><i class="bi bi-mortarboard-fill"></i></div>
      <div class="login-title">Presensi Siswa-Siswi<br><span id="loginNamaSekolah">SDN Karangpawitan 1</span></div>
      <div class="login-subtitle">Sistem Presensi Digital Sekolah</div>
    </div>

    <div id="alert-msg"></div>

    <div class="login-tabs" role="tablist">
      <button class="login-tab" data-tab="usernameTab" onclick="pilihTab('username')">
        <i class="bi bi-person"></i>Username
      </button>
      <button class="login-tab active" data-tab="uidTab" onclick="pilihTab('uid')">
        <i class="bi bi-credit-card-2-front"></i>UID Kartu
      </button>
    </div>

    <div id="loginTabUsername" class="login-tab-content">
      <div class="form-group-login">
        <label class="form-label-modern">Username</label>
        <div class="input-icon-wrapper">
          <i class="bi bi-person input-icon"></i>
          <input type="text" id="username" class="form-control-modern"
                 placeholder="Masukkan username" autocomplete="username">
        </div>
      </div>

      <div class="form-group-login">
        <label class="form-label-modern">Password</label>
        <div class="input-icon-wrapper">
          <i class="bi bi-lock input-icon"></i>
          <input type="password" id="password" class="form-control-modern"
                 placeholder="Masukkan password" autocomplete="current-password">
          <i class="bi bi-eye" id="togglePwd"
             style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:#64748B;font-size:16px;"></i>
        </div>
      </div>
    </div>

    <div id="loginTabUid" class="login-tab-content active">
      <div class="form-group-login">
        <label class="form-label-modern">UID Kartu RFID</label>
        <div class="input-icon-wrapper">
          <i class="bi bi-credit-card-2-front input-icon"></i>
          <input type="text" id="uid" class="form-control-modern"
                 placeholder="Masukkan UID 10 digit" maxlength="10" inputmode="numeric"
                 oninput="this.value=this.value.replace(/\D/g,'')">
        </div>
      </div>
      <p style="font-size:11px;color:#94A3B8;margin:2px 0 0;">Tempelkan kartu RFID atau masukkan UID 10 digit</p>
    </div>

    <button class="btn-login mt-3" id="btnLogin" onclick="doLogin()" style="display:none;">
      <i class="bi bi-box-arrow-in-right me-2"></i>Masuk
    </button>

  </div>
</div>

<script>
  let _tabLogin='uid';

  function pilihTab(tab){
    _tabLogin=tab;
    document.querySelectorAll('.login-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab+'Tab'));
    document.querySelectorAll('.login-tab-content').forEach(c=>c.classList.toggle('active',c.id==='loginTab'+tab.charAt(0).toUpperCase()+tab.slice(1)));
    document.getElementById('btnLogin').style.display=tab==='username'?'':'none';
    if(tab==='uid'){const el=document.getElementById('uid');el.focus();el.select();}
  }

  // Muat identitas sekolah (logo & nama)
  fetch('/api/identitas/public').then(r=>r.json()).then(res=>{
    if(res?.success && res.data){
      const d = res.data;
      if(d.logo) document.getElementById('loginLogo').innerHTML = '<img src="'+d.logo+'" style="width:64px;height:64px;border-radius:16px;object-fit:cover;">';
      if(d.nama_sekolah) document.getElementById('loginNamaSekolah').textContent = d.nama_sekolah;
    }
  }).catch(()=>{});

  // Enter key submit
  document.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

  // UID input always stays focused when UID tab is active
  document.getElementById('uid').addEventListener('blur', function(){
    if(_tabLogin==='uid') setTimeout(()=>this.focus(),10);
  });
  // Auto-submit when UID reaches 10 digits
  document.getElementById('uid').addEventListener('input', function(){
    if(this.value.length===10) doLogin();
  });

  // Toggle password
  document.getElementById('togglePwd').addEventListener('click', function(){
    const inp = document.getElementById('password');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    this.classList.toggle('bi-eye');
    this.classList.toggle('bi-eye-slash');
  });

  // Auto-focus UID on load
  document.addEventListener('DOMContentLoaded', function(){ document.getElementById('uid').focus(); });

  async function doLogin() {
    const btn      = document.getElementById('btnLogin');
    const alertEl  = document.getElementById('alert-msg');
    const isUid    = _tabLogin==='uid';

    let body;
    if(isUid){
      const uid = document.getElementById('uid').value.trim();
      if(!uid||uid.length!==10){
        alertEl.innerHTML = `<div class="alert-msg error"><i class="bi bi-exclamation-circle me-2"></i>UID harus 10 digit!</div>`;
        return;
      }
      body = JSON.stringify({ uid });
    } else {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) {
        alertEl.innerHTML = `<div class="alert-msg error"><i class="bi bi-exclamation-circle me-2"></i>Username dan password wajib diisi!</div>`;
        return;
      }
      body = JSON.stringify({ username, password });
    }

    if(!isUid){
      btn.disabled = true;
      btn.innerHTML = '<span class="loading-spinner" style="width:16px;height:16px;border-width:2px;vertical-align:middle;display:inline-block;margin-right:8px;"></span>Memproses...';
    }

    try {
      const res  = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body
      });
      const data = await res.json();

      if (data.success) {
        window.location.href = data.redirect;
      } else {
        alertEl.innerHTML = `<div class="alert-msg error"><i class="bi bi-exclamation-circle me-2"></i>${data.message}</div>`;
        if(!isUid){ btn.disabled = false; btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Masuk'; }
      }
    } catch(e) {
      alertEl.innerHTML = `<div class="alert-msg error">Koneksi error. Pastikan server berjalan.</div>`;
      if(!isUid){ btn.disabled = false; btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Masuk'; }
    }
  }
</script>
</body>
</html>
