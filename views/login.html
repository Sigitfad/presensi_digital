<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOGIN</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
<style>
body{background:url('/frame_body/background_body.png') center/100% 100% no-repeat fixed;margin:0;padding:0;min-height:100vh;}
.login-page{background:none!important;}
.login-tab-content{display:none;}
.login-tab-content.active{display:block;}
</style>
</head>
<body>
<div class="login-page">

  <div class="login-card" style="padding:28px;">
    <div class="login-logo" style="margin-bottom:0;">
      <div id="loginLogo" style="font-size:42px;"><i class="bi bi-mortarboard-fill"></i></div>
      <div class="login-title">LOGIN GTK<br><span id="loginNamaSekolah">SDN Karangpawitan 1</span></div>
      <div class="login-subtitle" style="margin-bottom:0;">Sistem Presensi Digital Sekolah</div>
    </div>

    <div id="alert-msg" style="margin:0;"></div>

    <div id="loginTabUid" class="login-tab-content active" style="margin-top:-4px;">
      <div>
        <div style="position:relative;max-width:240px;margin:0 auto;cursor:pointer;" onclick="document.getElementById('uid').focus()">
          <img src="/frame_body/rfid.png" alt="Tap RFID" style="width:100%;height:130px;display:block;border-radius:12px;object-fit:fill;">
          <input type="text" id="uid" maxlength="10" inputmode="numeric"
                 oninput="this.value=this.value.replace(/\D/g,'')"
                 style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;outline:none;background:transparent;caret-color:transparent;">
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  // Muat identitas sekolah (logo & nama)
  fetch('/api/identitas/public').then(r=>r.json()).then(res=>{
    if(res?.success && res.data){
      const d = res.data;
      if(d.logo) document.getElementById('loginLogo').innerHTML = '<img src="'+d.logo+'" style="width:100px;height:100px;border-radius:24px;object-fit:cover;">';
      if(d.nama_sekolah) document.getElementById('loginNamaSekolah').textContent = d.nama_sekolah;
    }
  }).catch(()=>{});

  const uidEl = document.getElementById('uid');
  const alertEl = document.getElementById('alert-msg');
  let _loginBusy = false;

  // Enter key submit
  document.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

  // UID input always stays focused
  uidEl.addEventListener('blur', function(){
    setTimeout(()=>uidEl.focus(),10);
  });
  // Auto-submit when UID reaches 10 digits
  uidEl.addEventListener('input', function(){
    if(this.value.length===10) doLogin();
  });

  // Auto-focus UID on load
  document.addEventListener('DOMContentLoaded', function(){ uidEl.focus(); });

  async function doLogin() {
    if(_loginBusy) return;
    const uid = uidEl.value.trim();
    if(!uid||uid.length!==10){
      alertEl.innerHTML = `<div class="alert-msg error"><i class="bi bi-exclamation-circle me-2"></i>UID harus 10 digit!</div>`;
      return;
    }

    _loginBusy = true;
    try {
      const res  = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uid })
      });
      const data = await res.json();

      if (data.success) {
        window.location.href = data.redirect;
      } else {
        alertEl.innerHTML = `<div class="alert-msg error"><i class="bi bi-exclamation-circle me-2"></i>${data.message}</div>`;
        uidEl.value = '';
      }
    } catch(e) {
      console.error('[Login] Error:', e);
      alertEl.innerHTML = `<div class="alert-msg error">Koneksi error. Pastikan server berjalan.</div>`;
    } finally {
      _loginBusy = false;
    }
  }
</script>
</body>
</html>
