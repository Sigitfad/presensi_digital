<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOGIN</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-page">


  <div class="login-card">
    <div class="login-logo">
      <div id="loginLogo"><i class="bi bi-mortarboard-fill"></i></div>
      <div class="login-title">Presensi Siswa-Siswi<br><span id="loginNamaSekolah">SDN Karangpawitan 1</span></div>
      <div class="login-subtitle">Sistem Presensi Digital Sekolah</div>
    </div>

    <div id="alert-msg"></div>

    <div class="form-group-login">
      <label class="form-label-modern">Username</label>
      <div class="input-icon-wrapper">
        <i class="bi bi-person input-icon"></i>
        <input type="text" id="username" class="form-control-modern"
               placeholder="Masukkan username" autocomplete="username">
      </div>
    </div>

    <div class="form-group-login">
      <label class="form-label-modern">Password</label>
      <div class="input-icon-wrapper">
        <i class="bi bi-lock input-icon"></i>
        <input type="password" id="password" class="form-control-modern"
               placeholder="Masukkan password" autocomplete="current-password">
        <i class="bi bi-eye" id="togglePwd"
           style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:#64748B;font-size:16px;"></i>
      </div>
    </div>

    <button class="btn-login mt-2" id="btnLogin" onclick="doLogin()">
      <i class="bi bi-box-arrow-in-right me-2"></i>Masuk
    </button>

    <div class="divider-text mt-4"><span>atau</span></div>

    <div class="text-center">
      <a href="/register" style="color:var(--primary);font-size:13.5px;font-weight:600;text-decoration:none;">
        <i class="bi bi-person-plus me-1"></i>Daftar Operator Baru
      </a>
    </div>

  </div>
</div>

<script>
  // Muat identitas sekolah (logo & nama)
  fetch('/api/identitas/public').then(r=>r.json()).then(res=>{
    if(res?.success && res.data){
      const d = res.data;
      if(d.logo) document.getElementById('loginLogo').innerHTML = '<img src="'+d.logo+'" style="width:64px;height:64px;border-radius:16px;object-fit:cover;">';
      if(d.nama_sekolah) document.getElementById('loginNamaSekolah').textContent = d.nama_sekolah;
    }
  }).catch(()=>{});

  // Enter key submit
  document.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

  // Toggle password
  document.getElementById('togglePwd').addEventListener('click', function(){
    const inp = document.getElementById('password');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    this.classList.toggle('bi-eye');
    this.classList.toggle('bi-eye-slash');
  });

  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('btnLogin');
    const alertEl  = document.getElementById('alert-msg');

    if (!username || !password) {
      alertEl.innerHTML = `<div class="alert-msg error"><i class="bi bi-exclamation-circle me-2"></i>Username dan password wajib diisi!</div>`;
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="loading-spinner" style="width:16px;height:16px;border-width:2px;vertical-align:middle;display:inline-block;margin-right:8px;"></span>Memproses...';

    try {
      const res  = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        window.location.href = data.redirect;
      } else {
        alertEl.innerHTML = `<div class="alert-msg error"><i class="bi bi-exclamation-circle me-2"></i>${data.message}</div>`;
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Masuk';
      }
    } catch(e) {
      alertEl.innerHTML = `<div class="alert-msg error">Koneksi error. Pastikan server berjalan.</div>`;
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Masuk';
    }
  }
</script>
</body>
</html>
