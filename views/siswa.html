<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Data Siswa</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .foto-circle-lg{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #E2E8F0;display:block;margin:0 auto;}
    .foto-ini-lg{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#DBEAFE,#EDE9FE);display:flex;align-items:center;justify-content:center;font-family:var(--font-main);font-size:28px;font-weight:800;color:#2563EB;border:3px solid #E2E8F0;margin:0 auto;}
    .foto-sm-img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #E2E8F0;}
    .foto-sm-ini{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#DBEAFE,#EDE9FE);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#2563EB;border:2px solid #E2E8F0;flex-shrink:0;}
    .btn-foto-edit{display:block;margin:8px auto 0;background:var(--primary-light);color:var(--primary);border:none;border-radius:8px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;}
    .btn-foto-edit:hover{background:var(--primary);color:white;}
    .btn-action{width:32px;height:32px;border:none;border-radius:8px;background:var(--gray-light);color:var(--gray);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;font-size:14px;}
    .btn-action:hover{background:var(--primary-light);color:var(--primary);transform:translateY(-1px);box-shadow:0 2px 8px rgba(37,99,235,0.15);}
    .btn-grad{width:32px;height:32px;border:none;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;font-size:14px;color:white;}
    .btn-grad:hover{transform:translateY(-1px);}
    .btn-grad.view{background:linear-gradient(135deg,#0EA5E9,#0284C7);}
    .btn-grad.view:hover{box-shadow:0 4px 12px rgba(14,165,233,0.35);}
    .btn-grad.edit{background:linear-gradient(135deg,#F59E0B,#D97706);}
    .btn-grad.edit:hover{box-shadow:0 4px 12px rgba(245,158,11,0.35);}
    .btn-grad.hapus{background:linear-gradient(135deg,#EF4444,#DC2626);}
    .btn-grad.hapus:hover{box-shadow:0 4px 12px rgba(239,68,68,0.35);}
    .btn-batal{background:#1E293B;color:white;border:none;font-weight:600;padding:8px 18px;font-size:13px;border-radius:8px;transition:all 0.2s linear;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
    .btn-batal:hover{background:#334155;transform:translateY(-1px);box-shadow:0 4px 10px rgba(30,41,59,0.3);}
    .kal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
    .kal-head{text-align:center;font-size:10px;font-weight:700;color:var(--gray);padding:4px 0;}
    .kal-day{text-align:center;padding:4px 2px;border-radius:5px;font-size:11px;font-weight:600;line-height:1.4;}
    .kal-day.hadir{background:#D1FAE5;color:#065F46;}
    .kal-day.terlambat{background:#FEF3C7;color:#92400E;}
    .kal-day.izin{background:#DBEAFE;color:#1E40AF;}
    .kal-day.sakit{background:#EDE9FE;color:#5B21B6;}
    .kal-day.alpha{background:#FEE2E2;color:#7F1D1D;}
    .kal-day.libur{background:transparent;color:#CBD5E1;}
    .kal-day.kosong{background:transparent;}
    #modalTambah .form-label-modern,
    #modalEdit .form-label-modern{font-size:10px;margin-bottom:2px;}
    #modalTambah .form-control-modern,
    #modalEdit .form-control-modern{padding:5px 8px;font-size:11px;}
    .swal-kecil{font-size:12px!important;border-radius:12px!important;}.swal-title-kecil{font-size:14px!important;padding:0!important;margin:0 0 4px!important;}.swal-text-kecil{font-size:12px!important;margin:0!important;}.swal-btn-kecil{font-size:11px!important;padding:5px 14px!important;border-radius:8px!important;}
  </style>
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script></head>
<body>
<div id="page-content" class="page-content">
  <div class="page-header d-flex align-items-center justify-content-between flex-wrap gap-2">
    <div>
      <div class="page-title" id="page-title-siswa">Data Siswa</div>
      <div class="page-subtitle" id="page-sub-siswa">Kelola Data Siswa SDN Karangpawitan 1</div>
    </div>
    <button class="btn-primary-custom" onclick="bukaTambah()"><i class="bi bi-person-plus"></i> Tambah Siswa</button>
  </div>

  <!-- Tombol Aksi Massal -->
  <div id="bulkActionsSiswa" style="display:none;margin-bottom:12px;padding:12px 16px;background:#F8FAFC;border:1.5px solid #CBD5E1;border-radius:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
    <div class="d-flex align-items-center gap-2 flex-wrap">
      <span style="font-size:13px;color:#1E293B;font-weight:600;"><span id="selectedCountSiswa">0</span> siswa dipilih</span>
      <input type="number" id="tahunLulus" class="form-control-modern" placeholder="Tahun Lulus" style="width:120px;padding:5px 10px;font-size:12px;" value="">
      <input type="date" id="tanggalPindah" class="form-control-modern" style="width:140px;padding:5px 10px;font-size:12px;">
      <input type="text" id="alasanPindah" class="form-control-modern" placeholder="Alasan pindah" style="width:140px;padding:5px 10px;font-size:12px;">
    </div>
    <div class="d-flex gap-2">
      <button class="btn-danger-custom" onclick="hapusMassalSiswa()" style="padding:6px 14px;font-size:12.5px;">Hapus</button>
      <button class="btn-primary-custom" onclick="lulusMassalSiswa()" style="padding:6px 14px;font-size:12.5px;">Update to Lulusan</button>
      <button class="btn-primary-custom" onclick="pindahMassalSiswa()" style="padding:6px 14px;font-size:12.5px;background:linear-gradient(135deg,#7C3AED,#6D28D9);" onmouseover="this.style.boxShadow='0 4px 12px rgba(124,58,237,0.35)'" onmouseout="this.style.boxShadow='none'">Update to Pindahan</button>
    </div>
  </div>

  <div class="card-modern">
    <div class="card-modern-header flex-wrap gap-2">
      <div class="d-flex gap-2 flex-wrap">
      <div style="position:relative;display:inline-block;">
        <input type="text" id="searchInput" class="form-control-modern" placeholder="Cari nama / NISN..."
               style="width:210px;padding-right:30px;" oninput="clearTimeout(window._dS);window._dS=setTimeout(()=>loadSiswa(),300);document.getElementById('clearSearch').style.display=this.value?'block':'none'">
        <button id="clearSearch" type="button" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94A3B8;cursor:pointer;display:none;font-size:16px;padding:2px 4px;line-height:1;" onclick="document.getElementById('searchInput').value='';loadSiswa();this.style.display='none'">&times;</button>
      </div>
        <select id="filterKelas" class="form-control-modern" style="width:145px;" onchange="loadSiswa()">
          <option value="">Semua Kelas</option>
        </select>
      </div>
      <span id="totalLabel" style="font-size:13px;color:white;background:#2563EB;border-radius:8px;padding:4px 14px;display:inline-block;font-weight:700;"></span>
    </div>
    <div class="table-responsive">
      <table class="table-modern">
        <thead><tr>
          <th style="width:36px;"><input type="checkbox" id="selectAllSiswa" onchange="toggleSelectAllSiswa()" style="cursor:pointer;accent-color:var(--primary);"></th>
          <th>#</th><th>Foto</th><th>NISN</th><th>Nama Siswa</th><th>Kelas</th><th>J.K</th><th>QR</th><th>Aksi</th></tr></thead>
        <tbody id="tableSiswa"><tr><td colspan="9" class="text-center py-4"><div class="loading-spinner"></div></td></tr></tbody>
      </table>
    </div>
  </div>
  <div id="paginationSiswa" class="pagination-bar d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3" style="display:none;"></div>
</div>

<!-- Modal Tambah -->
<div class="modal fade" id="modalTambah" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered" style="max-width:440px;">
    <div class="modal-content" style="border-radius:var(--radius-lg);border:none;">
      <div class="modal-header" style="background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-radius:var(--radius-lg) var(--radius-lg) 0 0;border:none;">
        <h5 class="modal-title text-white fw-bold">Tambah Siswa</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <div id="alertTambah"></div>
        <div class="text-center mb-3">
          <div id="tambah-foto-preview">
            <div class="foto-ini-lg" id="tambah-inisial"><i class="bi bi-person-fill" style="font-size:32px;"></i></div>
          </div>
          <!-- Tombol ganti foto (bukan onclick di wrapper) -->
          <button type="button" class="btn-foto-edit" id="tambah-foto-btn" onclick="bukaFotoTambah()">
            <i class="bi bi-camera me-1"></i>Tambah Foto
          </button>
        </div>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label-modern">Nama Lengkap *</label><input type="text" id="nama_baru" class="form-control-modern" placeholder="Nama siswa">
            <label class="form-label-modern mt-2">NIK</label><input type="text" id="nik_baru" class="form-control-modern" placeholder="Nomor Induk Kependudukan">
            <label class="form-label-modern mt-2">Tempat Lahir</label><input type="text" id="ttlahir_baru" class="form-control-modern" placeholder="Contoh: Garut">
            <label class="form-label-modern mt-2">Tanggal Lahir</label><input type="date" id="tanggallahir_baru" class="form-control-modern">
            <label class="form-label-modern mt-2">Alamat</label><textarea id="alamat_baru" class="form-control-modern" rows="2" placeholder="Alamat lengkap siswa"></textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label-modern">NISN *</label><input type="text" id="nisn_baru" class="form-control-modern" placeholder="Nomor Induk Siswa">
            <label class="form-label-modern mt-2">Kelas *</label>
            <select id="kelas_baru" class="form-control-modern"><option value="">Pilih Kelas</option></select>
            <label class="form-label-modern mt-2">Jenis Kelamin *</label>
            <select id="jk_baru" class="form-control-modern"><option value="">Pilih</option><option>Laki-laki</option><option>Perempuan</option></select>
            <label class="form-label-modern mt-2">Agama</label>
            <select id="agama_baru" class="form-control-modern"><option value="">Pilih</option><option>Islam</option><option>Kristen</option><option>Katolik</option><option>Hindu</option><option>Buddha</option><option>Konghucu</option></select>
            <label class="form-label-modern mt-2">No. HP Orang Tua</label><input type="text" id="nohp_ortu_baru" class="form-control-modern" placeholder="08xx">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-batal" data-bs-dismiss="modal">Batal</button>
        <button class="btn-primary-custom" onclick="simpanSiswa()">Simpan</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Edit -->
<div class="modal fade" id="modalEdit" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered" style="max-width:440px;">
    <div class="modal-content" style="border-radius:var(--radius-lg);border:none;">
      <div class="modal-header" style="background:linear-gradient(135deg,#F59E0B,#D97706);border-radius:var(--radius-lg) var(--radius-lg) 0 0;border:none;">
        <h5 class="modal-title text-white fw-bold">Edit Siswa</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

        <div id="alertEdit"></div>
        <input type="hidden" id="edit_id">
        <div class="text-center mb-3">
          <div id="edit-foto-preview" onclick="bukaFotoEdit()" style="cursor:pointer;"></div>
        </div>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label-modern">Nama Lengkap *</label><input type="text" id="edit_nama" class="form-control-modern">
            <label class="form-label-modern mt-2">NIK</label><input type="text" id="edit_nik" class="form-control-modern">
            <label class="form-label-modern mt-2">Tempat Lahir</label><input type="text" id="edit_ttlahir" class="form-control-modern">
            <label class="form-label-modern mt-2">Tanggal Lahir</label><input type="date" id="edit_tanggallahir" class="form-control-modern">

            <label class="form-label-modern mt-2">Agama</label>
            <select id="edit_agama" class="form-control-modern"><option value="">Pilih</option><option>Islam</option><option>Kristen</option><option>Katolik</option><option>Hindu</option><option>Buddha</option><option>Konghucu</option></select>
            <label class="form-label-modern mt-2">No. HP Orang Tua</label><input type="text" id="edit_nohp_ortu" class="form-control-modern">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-batal" data-bs-dismiss="modal">Batal</button>

<!-- Modal QR -->
<div class="modal fade" id="modalQR" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered" style="max-width:440px;">
    <div class="modal-content" style="border-radius:var(--radius-lg);border:none;">

<!-- Modal Detail Siswa -->
<div class="modal fade" id="modalDetail" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered" style="max-width:480px;">
    <div class="modal-content" style="border-radius:var(--radius-lg);border:none;">
      <div class="modal-header" style="background:linear-gradient(135deg,#6366F1,#4F46E5);border-radius:var(--radius-lg) var(--radius-lg) 0 0;border:none;">
        <h5 class="modal-title text-white fw-bold">Detail Siswa</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <div id="detailProfile"></div>
        <div style="display:flex;border-bottom:2px solid #E2E8F0;margin-bottom:14px;">
          <div id="_ds1" onclick="pilihTabDetailSiswa(1)" style="flex:1;text-align:center;padding:8px 16px;font-size:13px;font-weight:600;color:#6366F1;border-bottom:2px solid #6366F1;cursor:pointer;margin-bottom:-2px;transition:all 0.2s;">Data Siswa</div>
          <div id="_ds2" onclick="pilihTabDetailSiswa(2)" style="flex:1;text-align:center;padding:8px 16px;font-size:13px;font-weight:600;color:#94A3B8;cursor:pointer;margin-bottom:-2px;transition:all 0.2s;">Rekap Presensi</div>
        </div>
        <div id="_dsBody1">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
            <table style="width:100%;font-size:12.5px;border-collapse:collapse;" id="detailSiswaKiri"></table>
            <table style="width:100%;font-size:12.5px;border-collapse:collapse;" id="detailSiswaKanan"></table>
          </div>
          <div id="detailAlamat" style="margin-top:8px;"></div>
        </div>
        <div id="_dsBody2" style="display:none;">
          <div id="rekapSiswaBody"><div class="text-center py-4"><div class="loading-spinner"></div></div></div>
        </div>
      </div>
      <div style="padding:12px 20px;border-top:1px solid #E2E8F0;text-align:right;">
        <button class="btn-tutup" data-bs-dismiss="modal" style="background:#1E293B;border:none;color:#fff;border-radius:8px;font-weight:600;font-size:13px;padding:8px 20px;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.background='#334155';this.style.transform='translateY(-1px)';this.style.boxShadow='0 4px 12px rgba(30,41,59,0.3)';" onmouseout="this.style.background='#1E293B';this.style.transform='';this.style.boxShadow='none';">Tutup</button>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/js/app.js?v=5"></script>
<script>
let currentQRNISN='', currentQRNama='';
let tambahFotoBlob=null, tambahFotoUrl='';
let editFotoBlob=null,   editFotoUrl='',  editFotoSrcLama='', editSiswaId=null;

// ── Buka foto di tabel (klik foto kecil) ──
function bukaTabelFoto(s){
  showFotoDialog({
    fotoSrc: s.foto||'',
    onGanti:(blob,url)=>{
      // Langsung simpan ke server
      const fd=new FormData();
      fd.append('id',s.id);fd.append('nisn',s.nisn);fd.append('nama',s.nama);
      fd.append('kelas',s.kelas);fd.append('jenis_kelamin',s.jenis_kelamin);
      fd.append('foto',blob,'foto.png');
      fetchAPI('/api/siswa/edit','POST',fd).then(r=>{
        if(r?.success){showToast('Foto diperbarui!','success');loadSiswa();}
        else showToast(r?.message||'Gagal','error');
      });
    },
    onHapus:async()=>{
      const r=await fetchAPI('/api/siswa/hapus-foto','POST',{id:s.id});
      if(r?.success){showToast('Foto dihapus','success');loadSiswa();}
      else showToast(r?.message||'Gagal','error');
    },
    onUnduh: s.foto||null
  });
}

// ── Tambah foto di modal Tambah Siswa ──
function bukaFotoTambah(){
  // Buka file picker langsung → cropper (tanpa dialog foto profil)
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange=function(){
    const file=this.files[0]; if(!file) return;
    showCropper(file,(blob,url)=>{
      tambahFotoBlob=blob; tambahFotoUrl=url;
      document.getElementById('tambah-foto-preview').innerHTML=
        `<img src="${url}" class="foto-circle-lg">`;
      document.getElementById('tambah-foto-btn').innerHTML='<i class="bi bi-camera me-1"></i>Ganti Foto';
    });
  };
  inp.click();
}

// ── Edit foto di modal Edit Siswa ──
function bukaFotoEdit(){
  showFotoDialog({
    fotoSrc: editFotoSrcLama,
    onGanti:(blob,url)=>{
      editFotoBlob=blob; editFotoUrl=url; editFotoSrcLama=url;
      document.getElementById('edit-foto-preview').innerHTML=
        `<img src="${url}" class="foto-circle-lg">`;
    },
    onHapus:async()=>{
      if(editSiswaId){
        const r=await fetchAPI('/api/siswa/hapus-foto','POST',{id:editSiswaId});
        if(r?.success) showToast('Foto dihapus','success');
      }
      editFotoBlob=null; editFotoUrl=''; editFotoSrcLama='';
      const nama=document.getElementById('edit_nama').value;
      const ini=nama.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()||'?';
      document.getElementById('edit-foto-preview').innerHTML=
        `<div class="foto-ini-lg">${ini}</div>`;
    },
    onUnduh: editFotoSrcLama||null
  });
}

let _siswaData=[], _siswaPage=1, _siswaPerPage=5;

function renderSiswaRow(d, i) {
  const ini = d.nama.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const fotoHtml = d.foto
    ? `<img src="${d.foto}" class="foto-sm-img" onclick="bukaTabelFoto(_siswaData[${i}])">`
    : `<div class="foto-sm-ini" onclick="bukaTabelFoto(_siswaData[${i}])">${ini}</div>`;
  const jkLabel = d.jenis_kelamin === 'Laki-laki' ? 'L' : 'P';
  return `<tr>
    <td><input type="checkbox" class="siswa-check" value="${d.id}" onchange="updateBulkSiswa()" style="cursor:pointer;accent-color:var(--primary);"></td>
    <td style="color:var(--gray)">${i+1}</td>
    <td>${fotoHtml}</td>
    <td style="font-weight:600">${d.nisn}</td>
    <td style="font-weight:700;color:var(--dark)">${d.nama}</td>
    <td>${d.kelas}</td>
    <td style="font-size:12px;color:${d.jenis_kelamin==='Laki-laki'?'#2563EB':'#DB2777'};font-weight:700;">${jkLabel}</td>
    <td><button class="btn-action" title="QR Code" onclick="lihatQR(_siswaData[${i}].nisn,_siswaData[${i}].nama,_siswaData[${i}].kelas)"><i class="bi bi-qr-code"></i></button></td>
    <td>
      <div class="d-flex gap-1">
        <button class="btn-grad view" title="Lihat Detail" onclick="viewSiswa(_siswaData[${i}])"><i class="bi bi-eye-fill"></i></button>
        <button class="btn-grad edit" title="Edit" onclick="bukaEdit(_siswaData[${i}])"><i class="bi bi-pencil-fill"></i></button>
        <button class="btn-grad hapus" title="Hapus" onclick="hapusSiswa(${d.id},_siswaData[${i}].nama)"><i class="bi bi-trash3-fill"></i></button>
      </div>
    </td>
  </tr>`;
}

function renderSiswaPage(){
  const tbody=document.getElementById('tableSiswa');
  if(!_siswaData.length){
    tbody.innerHTML='<tr><td colspan="9"><div class="empty-state"><i class="bi bi-people"></i><p>Tidak ada data</p></div></td></tr>';
    document.getElementById('paginationSiswa').style.display='none';
    return;
  }
  const pp=_siswaPerPage;
  const totalPages=Math.ceil(_siswaData.length/pp);
  if(_siswaPage>totalPages) _siswaPage=totalPages;
  const start=(_siswaPage-1)*pp;
  const end=Math.min(start+pp,_siswaData.length);
  tbody.innerHTML=_siswaData.slice(start,end).map((s,i)=>renderSiswaRow(s,start+i)).join('');
  document.getElementById('selectAllSiswa').checked=false;
  updateBulkSiswa();
  buildPaginationUI('paginationSiswa',{
    currentPage:_siswaPage, totalPages, currentSize:_siswaPerPage,
    sizes:[5,10,15,20,25,50],
    onPageChange:p=>{_siswaPage=p;renderSiswaPage();},
    onSizeChange:s=>{_siswaPerPage=s;_siswaPage=1;renderSiswaPage();}
  });
}

async function loadSiswa(){
  const search=document.getElementById('searchInput').value;
  const kelas =document.getElementById('filterKelas').value.trim();
  const tbody =document.getElementById('tableSiswa');
  tbody.innerHTML='<tr><td colspan="9" class="text-center py-4"><div class="loading-spinner"></div></td></tr>';
  const res=await fetchAPI(`/api/siswa?${new URLSearchParams({search,kelas})}`);
  if(!res) return;
  _siswaData=res.data||[];
  document.getElementById('totalLabel').textContent=`Total: ${_siswaData.length} siswa`;
  _siswaPage=1;
  renderSiswaPage();
}

async function simpanSiswa(){
  const alertEl=document.getElementById('alertTambah');
  const nisn=document.getElementById('nisn_baru').value.trim();
  const nama=document.getElementById('nama_baru').value.trim();
  const kelas=document.getElementById('kelas_baru').value;
  const jk=document.getElementById('jk_baru').value;
  if(!nisn||!nama||!kelas||!jk){alertEl.innerHTML='<div class="alert-msg error">Semua field wajib diisi!</div>';return;}
  const fd=new FormData();
  fd.append('nisn',nisn);fd.append('nama',nama);fd.append('kelas',kelas);fd.append('jenis_kelamin',jk);
  fd.append('nik',document.getElementById('nik_baru').value.trim());
  fd.append('tempat_lahir',document.getElementById('ttlahir_baru').value.trim());
  fd.append('tanggal_lahir',document.getElementById('tanggallahir_baru').value);
  fd.append('agama',document.getElementById('agama_baru').value);
  fd.append('alamat',document.getElementById('alamat_baru').value.trim());
  fd.append('no_hp_ortu',document.getElementById('nohp_ortu_baru').value.trim());
  if(tambahFotoBlob) fd.append('foto',tambahFotoBlob,'foto.png');
  const {isConfirmed:konfirmTambah}=await Swal.fire({title:'Konfirmasi Simpan',text:'Apakah data yang diisi sudah benar?',icon:'question',showCancelButton:true,confirmButtonText:'Ya, Simpan',cancelButtonText:'Batal',confirmButtonColor:'#2563EB',cancelButtonColor:'#1E293B',reverseButtons:true,width:'300px',padding:'16px',customClass:{popup:'swal-kecil',title:'swal-title-kecil',htmlContainer:'swal-text-kecil',confirmButton:'swal-btn-kecil',cancelButton:'swal-btn-kecil'}});
  if(!konfirmTambah) return;
  const res=await fetchAPI('/api/siswa/tambah','POST',fd);
  if(res?.success){closeModal('modalTambah');showToast('Siswa ditambahkan!','success');tambahFotoBlob=null;loadSiswa();alertEl.innerHTML='';}
  else alertEl.innerHTML=`<div class="alert-msg error">${res?.message||'Gagal'}</div>`;
}

    var parts=g.pengampu.split(', '),tmp=[];
    for(var i=0;i<parts.length;i+=2)tmp.push(parts[i]+', '+(parts[i+1]||''));
    pengampuList=tmp;
  } else if(!pengampuList){pengampuList=[];}
  const ini = d.nama.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const fotoHtml = d.foto
    ? `<img src="${d.foto}" style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid #E2E8F0;cursor:pointer;" onclick="bukaTabelFoto(_viewSiswaData)">`

  document.getElementById('detailProfile').innerHTML=
    `<div style="display:flex;gap:12px;margin-bottom:14px;align-items:center;">${fotoHtml}<div><div style="font-weight:700;font-size:15px;">${d.nama}</div><div style="font-size:12px;color:#64748B;">NISN: ${d.nisn} &middot; ${d.kelas}</div></div></div>`;
  const fmt=dt=>dt?dt.split('-').reverse().join('/'):'-';
  const t=(l,v)=>`<tr><td style="padding:2px 0;color:#64748B;font-size:11px;">${l}</td></tr><tr><td style="padding:0 0 3px 0;font-weight:600;font-size:12px;">${v||'-'}</td></tr>`;
  document.getElementById('detailSiswaKiri').innerHTML=
    t('Nama Lengkap',d.nama)+
    t('NISN',d.nisn)+
    t('Kelas',d.kelas)+
    t('NIK',d.nik)+

    t('Tempat Lahir',d.tempat_lahir)+

    t('Jenis Kelamin',d.jenis_kelamin==='Laki-laki'?'Laki-laki':'Perempuan')+
    t('No. HP Orang Tua',d.no_hp_ortu)+

const BULAN_NAMA_R=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
let _rekapSiswaId=null, _rekapSiswaNama='';

async function loadRekapSiswa(siswaId, nama){
  const prevBulan = document.getElementById('rkBulan')?.value;
  const prevTahun = document.getElementById('rkTahun')?.value;
  const now=new Date();
  const bulan=prevBulan||String(now.getMonth()+1).padStart(2,'0');
  const tahun=prevTahun||now.getFullYear();
  document.getElementById('rekapSiswaBody').innerHTML=`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
      <select id="rkBulan" class="form-select form-select-sm" style="width:auto;border-radius:8px;font-size:12px;">
        <option value="01">Januari</option><option value="02">Februari</option>
        <option value="03">Maret</option><option value="04">April</option>
        <option value="05">Mei</option><option value="06">Juni</option>
        <option value="07">Juli</option><option value="08">Agustus</option>
        <option value="09">September</option><option value="10">Oktober</option>
        <option value="11">November</option><option value="12">Desember</option>
      </select>
      <input type="number" id="rkTahun" class="form-control-modern" style="width:100px;border-radius:8px;font-size:12px;padding:5px 8px;border:1px solid #CBD5E1;" min="2020" max="2099">
      <button class="btn-primary-custom" style="padding:5px 12px;font-size:12px;" onclick="loadRekapSiswa(_rekapSiswaId,_rekapSiswaNama)"><i class="bi bi-search"></i></button>
    </div>
    <div id="rkKalender"><div class="text-center py-4"><div class="loading-spinner"></div></div></div>`;
  document.getElementById('rkBulan').value=bulan;
  document.getElementById('rkTahun').value=tahun;
  const bln=document.getElementById('rkBulan').value;
  const thn=document.getElementById('rkTahun').value;
  const res=await fetchAPI(`/api/rekap/detail/${siswaId}?bulan=${bln}&tahun=${thn}`);
  if(!res?.success){ document.getElementById('rkKalender').innerHTML='<div class="text-center py-4" style="color:var(--gray)">Gagal memuat data</div>'; return; }
  const map={}; res.data.forEach(p=>{map[p.tanggal]=p;});
  const dim=new Date(parseInt(thn),parseInt(bln),0).getDate();
  const off=new Date(parseInt(thn),parseInt(bln)-1,1).getDay();
  let h=0,t=0,i=0,s=0,a=0;
  res.data.forEach(p=>{if(p.status==='Hadir')h++;else if(p.status==='Terlambat'){h++;t++;}else if(p.status==='Izin')i++;else if(p.status==='Sakit')s++;else if(p.status==='Alpha')a++;});
  const bStr=String(parseInt(bln)).padStart(2,'0');
  let html=`<div class="row g-2 mb-3">
    ${[['#D1FAE5','#059669',h,'Hadir'],['#FEF3C7','#D97706',t,'Terlambat'],['#DBEAFE','#2563EB',i,'Izin'],['#EDE9FE','#7C3AED',s,'Sakit'],['#FEE2E2','#DC2626',a,'Alpha']].map(([bg,col,val,lbl])=>`<div class="col"><div style="background:${bg};border-radius:8px;padding:8px;text-align:center;"><div style="font-size:18px;font-weight:800;color:${col}">${val}</div><div style="font-size:10px;color:${col};font-weight:600">${lbl}</div></div></div>`).join('')}
  </div>
  <div class="kal-grid mb-1">${['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(x=>`<div class="kal-head">${x}</div>`).join('')}</div>
  <div class="kal-grid">`;
  for(let x=0;x<off;x++) html+=`<div class="kal-day kosong"></div>`;
  for(let d=1;d<=dim;d++){
    const tgl=`${thn}-${bStr}-${String(d).padStart(2,'0')}`;
    const hw=new Date(parseInt(thn),parseInt(bln)-1,d).getDay();
    const p=map[tgl];
    if(hw===0){html+=`<div class="kal-day libur">${d}<br><small>Libur</small></div>`;}
    else if(p){
      const cls=p.status==='Hadir'?'hadir':p.status==='Terlambat'?'terlambat':p.status==='Izin'?'izin':p.status==='Sakit'?'sakit':'alpha';
      const lbl=p.status==='Terlambat'?'T':p.status[0];
      html+=`<div class="kal-day ${cls}" title="${p.status}${p.jam_masuk?' '+p.jam_masuk.slice(0,5):''}">${d}<br><small>${lbl}</small></div>`;
    } else {
      html+=`<div class="kal-day alpha" title="Alpha">${d}<br><small>A</small></div>`;
    }
  }
  html+='</div>';
  document.getElementById('rkKalender').innerHTML=html;
}

function downloadQR(){
  setTimeout(()=>{
    const c=document.querySelector('#qrCodeDisplay canvas');
    if(!c){showToast('QR belum siap','error');return;}

    a.href=c.toDataURL('image/png');a.click();
    showToast('QR didownload!','success');
  },100);
}

async function init(){
  await loadLayout('siswa','Data Siswa');
  await Promise.all([
    loadKelasOptions('filterKelas', true),
    loadKelasOptions('kelas_baru', false),
    loadKelasOptions('edit_kelas', false)
  ]);
  const session = window._session || {};
  const pengampu= session.pengampuKelas || 'Semua';
  const role    = session.role || 'operator';
  if(role !== 'operator' && pengampu !== 'Semua'){
    document.getElementById('page-title-siswa').textContent = `Data Siswa - Pengampu ${pengampu}`;
    document.getElementById('page-sub-siswa').textContent   = `Kelola data siswa kelas ${pengampu}`;
    const fk = document.getElementById('filterKelas');
    const kb = document.getElementById('kelas_baru');
    const ek = document.getElementById('edit_kelas');
    const setKelasDropdown = (sel, isMulti) => {
      if(isMulti){
        const list = pengampu.split(',').map(k=>k.trim()).filter(Boolean);
        sel.innerHTML = '<option value="">Pilih Kelas</option>' + list.map(k=>`<option value="${k}">${k}</option>`).join('');
      } else {
        sel.innerHTML = ''; // clear any existing
        const opt = document.createElement('option');
        opt.value = pengampu; opt.textContent = pengampu;
        sel.appendChild(opt);
        sel.value = pengampu;
      }
    };
    if(pengampu.includes(',')){
      const list = pengampu.split(',').map(k=>k.trim()).filter(Boolean);
      fk.innerHTML = '<option value="">Semua Kelas</option>' + list.map(k=>`<option value="${k}">${k}</option>`).join('');
      fk.value = '';
      setKelasDropdown(kb, true);
      setKelasDropdown(ek, true);
    } else {
      fk.value = pengampu;
      fk.disabled = true;
      fk.style.opacity = '0.6';
      setKelasDropdown(kb, false);
      kb.disabled = true;
      kb.style.opacity = '0.6';
      setKelasDropdown(ek, false);
      ek.disabled = true;
      ek.style.opacity = '0.6';
    }
  }
  document.getElementById('tanggalPindah').value=new Date().toISOString().split('T')[0];
  loadSiswa();
}
init();
